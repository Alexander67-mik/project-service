services:
  app:
    tty: true
    network_mode: host
    image: swr.eu-de.otc.t-systems.com/testbirds-nest/project-service:v1.0.0
    command: tail -f /dev/null
    volumes:
      - ./:/var/www/application
    ports:
      - 8000:8000
  mysqldb:
    network_mode: host
    image: mysql:8.1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
  mongodb:
    network_mode: host
    image: mongo:4.0
    ports:
        - 27017:27017
